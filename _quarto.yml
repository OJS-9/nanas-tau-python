project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "lectures/*.qmd"
  resources:
    - "lectures/pdf/*.pdf"   # printable slide PDFs, made locally by scripts/slides-pdf.sh

execute:
  freeze: auto        # code runs locally only; CI reuses _freeze/
  warning: false
  message: false

jupyter: python3

lang: he
dir: rtl

website:
  title: "ניתוח נתונים סטטיסטי"
  site-url: https://OJS-9.github.io/nanas-tau-python/
  repo-url: https://github.com/OJS-9/nanas-tau-python
  repo-actions: [source, issue]
  page-navigation: true
  navbar:
    background: primary
    left:
      - href: index.qmd
        text: בית
      - text: הרצאות
        menu:
          - href: lectures.qmd
            text: "כל ההרצאות"
          - text: "---"
          - href: lectures/00-course-intro.qmd
            text: "0. פתיחה: על הקורס"
          - href: lectures/01-nonparametric.qmd
            text: "1. שיטות א-פרמטריות"
          - href: lectures/03-multiple-regression.qmd
            text: "3. רגרסיה לינארית מרובה"
      - href: syllabus.qmd
        text: סילבוס
      - href: https://moodle.tau.ac.il/course/view.php?id=571313701
        text: Moodle
        target: _blank
    right:
      - icon: github
        href: https://github.com/OJS-9/nanas-tau-python
        aria-label: GitHub
  page-footer:
    center: "ד״ר עדי שריד · הפקולטה להנדסה, אוניברסיטת תל אביב · תשפ״ז"
    left: "גרסת Python לא רשמית של אתר הקורס של ד״ר עדי שריד · [האתר המקורי](https://adisarid.github.io/nanas-tau/)"
    right: "עודכן לאחרונה: 19.10.2026"   # update on every push to main (see README)

format:
  html:
    theme:
      light: [cosmo, assets/styles.scss]
      dark: [darkly, assets/styles.scss]
    toc: true
    toc-title: "בעמוד זה"
    code-fold: false
    code-tools: false
    code-copy: true
    highlight-style: github
